<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f9fa">
  <title>Dokumen Sekolah | SMK PGRI Cikoneng</title>
  <link rel="icon" type="image/png" href="/assets/logo-pgri-cikoneng.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/spmb-theme.css?v=20261125-5">
  <style>
    body { font-family: "Plus Jakarta Sans", Arial, sans-serif; }
    .documents-main { width: min(100% - 32px, 1120px); margin: 0 auto; padding: 48px 0 64px; }
    .documents-heading { margin-bottom: 24px; }
    .documents-heading p { max-width: 650px; margin: 10px 0 0; color: #64748b; font-size: 14px; line-height: 1.7; }
    .document-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); gap: 16px; }
    .document-card { display: flex; min-height: 190px; flex-direction: column; padding: 22px; border: 1px solid #e4e9f0; border-top: 3px solid #f97316; border-radius: 18px; background: white; box-shadow: 0 10px 32px #16243a0a; }
    .document-card h2 { margin: 0; color: #172554; font-size: 17px; }
    .document-card p { margin: 9px 0 18px; color: #64748b; font-size: 13px; line-height: 1.65; }
    .document-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
    .document-card .document-action { display: inline-flex; box-sizing: border-box; min-width: 0; min-height: 40px; align-items: center; justify-content: center; gap: 7px; padding: 7px 12px; border: 1px solid #dbe3ec; border-radius: 8px; color: #0f172a; background: white; font-size: 12px; font-weight: 700; text-decoration: none; transition: background .16s ease, border-color .16s ease, transform .16s ease; }
    .document-card .document-action:hover { transform: translateY(-1px); }
    .document-card .document-action-download { border-color: #ea580c; color: white; background: #f97316; }
    .document-card .document-action-download:hover { border-color: #c2410c; background: #ea580c; }
    .document-card svg { width: 16px; height: 16px; }
    .document-status { padding: 22px; border: 1px dashed #cbd5e1; border-radius: 16px; color: #64748b; background: white; }
    @media (max-width: 640px) { .documents-main { padding-top: 30px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header id="site-header" class="no-print site-header">
    <div class="site-header-inner">
      <a href="https://www.smkpgricikoneng.sch.id/" class="site-brand" aria-label="Situs resmi SMK PGRI Cikoneng">
        <img src="/assets/logo-pgri-cikoneng.png" alt="" width="44" height="44">
        <span>SMK PGRI <small>Cikoneng</small></span>
      </a>
      <nav class="site-nav" aria-label="Navigasi utama">
        <a href="/">Beranda</a>
        <a href="/pencarian">Pencarian Pendaftar</a>
        <a href="/dokumen" aria-current="page">Dokumen</a>
        <a href="/pendaftaran">Pendaftaran</a>
        <a class="site-nav-login" href="/portal">Login Siswa</a>
      </nav>
    </div>
  </header>
  <main class="documents-main">
    <div class="documents-heading">
      <h1>Dokumen Sekolah</h1>
      <p>Unduh formulir, informasi beasiswa, dan dokumen resmi lain yang disediakan oleh SMK PGRI Cikoneng.</p>
    </div>
    <div id="document-status" class="document-status" role="status">Memuat daftar dokumen...</div>
    <div id="document-list" class="document-grid" aria-live="polite"></div>
  </main>
  <script>
    async function loadSchoolDocuments() {
      const status = document.getElementById('document-status');
      const list = document.getElementById('document-list');
      try {
        const response = await fetch('/api/public-config', { headers: { Accept: 'application/json' } });
        const config = await response.json();
        if (!response.ok) throw new Error(config.message || 'Daftar dokumen tidak dapat dimuat.');
        const documents = Array.isArray(config.schoolDocuments) ? config.schoolDocuments : [];
        list.replaceChildren();
        if (!documents.length) {
          status.textContent = 'Belum ada dokumen yang dipublikasikan.';
          status.hidden = false;
          return;
        }
        documents.slice().sort(function (a, b) { return Number(a.order) - Number(b.order); }).forEach(function (documentInfo) {
          const card = document.createElement('article');
          card.className = 'document-card';
          const title = document.createElement('h2');
          title.textContent = documentInfo.title;
          const description = document.createElement('p');
          description.textContent = documentInfo.description || 'Dokumen resmi dari SMK PGRI Cikoneng.';
          const actions = document.createElement('div');
          actions.className = 'document-actions';
          const previewLink = document.createElement('a');
          previewLink.className = 'document-action document-action-preview';
          previewLink.href = documentInfo.url;
          previewLink.target = '_blank';
          previewLink.rel = 'noopener noreferrer';
          previewLink.setAttribute('aria-label', 'Preview ' + documentInfo.title);
          previewLink.innerHTML = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/></svg><span>Preview</span>';
          const downloadLink = document.createElement('a');
          downloadLink.className = 'document-action document-action-download';
          downloadLink.href = documentInfo.url;
          downloadLink.target = '_blank';
          downloadLink.rel = 'noopener noreferrer';
          downloadLink.setAttribute('download', '');
          downloadLink.setAttribute('aria-label', 'Download ' + documentInfo.title);
          downloadLink.innerHTML = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 16v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg><span>Download</span>';
          actions.append(previewLink, downloadLink);
          card.append(title, description, actions);
          list.appendChild(card);
        });
        status.hidden = true;
      } catch (error) {
        status.textContent = error.message || 'Daftar dokumen gagal dimuat.';
        status.hidden = false;
      }
    }
    loadSchoolDocuments();
  </script>
</body>
</html>
